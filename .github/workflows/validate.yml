name: Validate examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject populated environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo 'Populated .env files are not allowed in this public repository.' >&2
            exit 1
          fi

      - name: Validate Compose files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' compose_file; do
            service_dir="$(dirname "$compose_file")"
            if [[ -f "$service_dir/.env.example" ]]; then
              cp "$service_dir/.env.example" "$service_dir/.env"
            fi
            if ! output="$(docker compose -f "$compose_file" config --quiet 2>&1)"; then
              output="${output//'%'/'%25'}"
              output="${output//$'\r'/'%0D'}"
              output="${output//$'\n'/'%0A'}"
              echo "::error file=$compose_file::$output"
              failed=1
            fi
          done < <(find apps -name compose.yaml -print0)
          exit "$failed"
