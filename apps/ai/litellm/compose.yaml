services:
  litellm:
    image: ghcr.io/berriai/litellm:latest@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    container_name: litellm
    restart: unless-stopped
    ports:
      - 4000:4000
    volumes:
      - ${LITELLM_CONFIG_FILE:-./config.example.yaml}:/app/config.yaml:ro
    environment:
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - STORE_MODEL_IN_DB=True
      - PROXY_BASE_URL=https://litellm.example.com
      - CONTROL_PLANE_URL=https://litellm.example.com
    security_opt:
      - no-new-privileges=true
    networks:
      - frontend
      - backend

networks:
  frontend:
    external: true
  backend:
    external: true
