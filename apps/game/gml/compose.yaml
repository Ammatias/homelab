name: gml-core

services:
  api:
    image: ghcr.io/gml-launcher/gml.web.api:v2025.3.3@sha256:2213bb37264f95a1cd1f6b99e6f2b6331f776a29da3cb3479e79412dafebd2d5
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-./data}/GmlBackend:/root/${PROJECT_NAME}
      - ${DATA_ROOT:-./data}/backups:/root/${PROJECT_NAME}/backups
      - gml-system-data:/app/database
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
      SECURITY_KEY: ${SECURITY_KEY}
      PROJECT_NAME: ${PROJECT_NAME}
      MARKET_ENDPOINT: ${MARKET_ENDPOINT}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION}
      PROJECT_POLICYNAME: ${PROJECT_POLICYNAME}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PROJECT_PATH: ${PROJECT_PATH}
      SERVICE_TEXTURE_ENDPOINT: ${SERVICE_TEXTURE_ENDPOINT}
      AllowedHosts: "*"
      TZ: ${TZ:-Etc/UTC}
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - gml

  proxy:
    image: ghcr.io/gml-launcher/gml.web.proxy:v2025.3.3@sha256:47e98724bca6d77dd90a3efac13907f36a6ef3f7b888ca9f27fec755614d7da2
    restart: unless-stopped
    ports:
      - "${GML_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - gml

  frontend:
    image: ghcr.io/gml-launcher/gml.web.client:v2025.3.3@sha256:fa310a7b865df436e8c6a25e4aa1afc2528020978dc080bce87144e4f5f91241
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
    networks:
      - gml

  skins:
    image: ghcr.io/gml-launcher/gml.web.skin.service:v2025.3.3@sha256:27222d5faf13efec933350e7bc90948556bf487a8fe1ac83e6431edd5bac22c9
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8085
      TZ: ${TZ:-Etc/UTC}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${DATA_ROOT:-./data}/TextureService:/app/Storage
    networks:
      - gml

networks:
  gml:
    attachable: true

volumes:
  gml-system-data:
