x-common:
  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_PASSWORD: &db-password ${MYSQL_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  panel:
    &panel-environment
    APP_URL: "https://pterodactyl.example.com"
    # A list of valid timezones can be found here: http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "Asia/Yekaterinburg"
    APP_SERVICE_AUTHOR: "system@example.com"
    # Uncomment the line below and set to a non-empty value if you want to use Let's Encrypt
    # to generate an SSL certificate for the Panel.
    # LE_EMAIL: ""
  mail:
    &mail-environment
    MAIL_FROM: ${MAIL_FROM}
    MAIL_DRIVER: ${MAIL_DRIVER}
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#
services:
  database:
    image: mariadb:11@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "${DATA_ROOT:-./data}/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    networks:
      - "backend"
  cache:
    image: redis:alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    restart: unless-stopped
    networks:
      - "backend"
  panel:
    image: ghcr.io/pterodactyl/panel:latest@sha256:e27a06cfcd078691ddf9805ae0dee2ee529b35ce18e427ef970de4d503602f2c
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    links:
      - database
      - cache
    volumes:
      - "${DATA_ROOT:-./data}/var/:/app/var/"
      - "${DATA_ROOT:-./data}/nginx/:/etc/nginx/http.d/"
      - "${DATA_ROOT:-./data}/certs/:/etc/letsencrypt/"
      - "${DATA_ROOT:-./data}/logs/:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      HASHIDS_LENGTH: 8
    networks:
      - "frontend"
      - "backend"

networks:
  frontend:
    external: true
  backend:
    external: true