services:
  backend:
    image: clusterzx/ts6-manager:backend@sha256:632cdbb3100496374936192c5575e72e2783d385561820e7baac426e2f8009da
    container_name: ts6-manager-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/app/packages/backend/data/ts6webui.db
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TS_ALLOW_SELF_SIGNED: ${TS_ALLOW_SELF_SIGNED:-false}
      JWT_ACCESS_EXPIRY: 15m
      TS_INTERNAL_HTTP_HOSTS: request-music-controller
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      MUSIC_DIR: /data/music
      SIDECAR_URL: http://sidecar:9800
    volumes:
      - ${TS6_MANAGER_DATA_DIR:-./data}/backend-data:/app/packages/backend/data
      - ${TS6_MANAGER_DATA_DIR:-./data}/music:/data/music
      - ${TS6_MANAGER_DATA_DIR:-./data}/bin/yt-dlp:/usr/local/bin/yt-dlp:ro
      - ${TS6_MANAGER_DATA_DIR:-./data}/bin/deno:/usr/local/bin/deno:ro
      - ${TS6_MANAGER_DATA_DIR:-./data}/yt-dlp-plugins:/root/.config/yt-dlp/plugins:ro
      - ${TS6_MANAGER_DATA_DIR:-./data}/yt-dlp-config:/root/.config/yt-dlp/config:ro
      - ${TS6_MANAGER_DATA_DIR:-./data}/request-bot/ts6-url-validator.js:/app/packages/backend/dist/utils/url-validator.js:ro
    security_opt:
      - no-new-privileges=true
    sysctls:
      - net.ipv4.tcp_mtu_probing=2
      - net.ipv4.tcp_base_mss=1400
    extra_hosts:
      - "rr5---sn-4g5edndd.googlevideo.com:173.194.164.212"
    depends_on:
      - sidecar
      - bgutil-provider
    networks:
      frontend: {}
      ts6-manager-egress:
        gw_priority: 1
    logging:
      options:
        max-size: 10m
        max-file: "3"

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2@sha256:9a96e6385ce1928da87dea07b1cab0413d2cf8c07a3b8a8bd419f53df2c3843c
    container_name: ts6-manager-bgutil-provider
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges=true
    networks:
      - frontend
    logging:
      options:
        max-size: 10m
        max-file: "3"

  sidecar:
    image: clusterzx/ts6-manager:sidecar@sha256:49ef528a1ccf03fe5793aa913206fcd0210bac519e5eab10710aa020564d26fe
    container_name: ts6-manager-sidecar
    restart: unless-stopped
    environment:
      SIDECAR_PORT: 9800
    security_opt:
      - no-new-privileges=true
    networks:
      - frontend
    logging:
      options:
        max-size: 10m
        max-file: "3"

  request-music-controller:
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    container_name: ts6-manager-request-music-controller
    restart: unless-stopped
    command: ["node", "/app/controller.mjs"]
    environment:
      MANAGER_BACKEND_URL: http://backend:3001
      REQUEST_BOT_ID: ${REQUEST_BOT_ID:-2}
      VERIFIED_GROUP_ID: ${VERIFIED_GROUP_ID:-10}
      PUBLIC_TEAMSPEAK_HOST: ${PUBLIC_TEAMSPEAK_HOST}
      MANAGER_USER_ID: ${MANAGER_USER_ID:-1}
      MANAGER_USERNAME: ${MANAGER_USERNAME:-controller}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ${TS6_MANAGER_DATA_DIR:-./data}/request-bot/request-music-controller.mjs:/app/controller.mjs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges=true
    depends_on:
      - backend
    networks:
      - frontend
    logging:
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: clusterzx/ts6-manager:frontend@sha256:4c43304a86a472241e0482179330a307a10119d781fda0204c848d37861d6197
    container_name: ts6-manager-frontend
    restart: unless-stopped
    ports:
      - 3000:80
    security_opt:
      - no-new-privileges=true
    depends_on:
      - backend
    networks:
      - frontend
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
    external: true
  ts6-manager-egress:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1492"
