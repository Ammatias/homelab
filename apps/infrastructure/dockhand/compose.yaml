services:
  dockhand:
    image: fnsys/dockhand:latest@sha256:5c9bb5e3c35a7804e7945578e3dacddb9ff847ccc2e0f58b9045fa1327030837
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-./data}:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL}
    security_opt:
      - no-new-privileges=true
    networks:
      - frontend

networks:
  frontend:
    external: true