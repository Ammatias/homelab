services:
  unbound-mailcow:
    image: ghcr.io/mailcow/unbound:1.25.1-1@sha256:098816f26207927e798bd55acf54a2cffed1f420b839a429089a65929c4464b0
    environment:
    - TZ=${TZ}
    - SKIP_UNBOUND_HEALTHCHECK=${SKIP_UNBOUND_HEALTHCHECK:-n}
    volumes:
    - /home/mailcow/data/hooks/unbound:/hooks:Z
    - /home/mailcow/data/conf/unbound/unbound.conf:/etc/unbound/unbound.conf:ro,Z
    restart: always
    tty: true
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.254
        aliases:
        - unbound
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mysql-mailcow:
    image: mariadb:10.11@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
    depends_on:
    - unbound-mailcow
    - netfilter-mailcow
    stop_grace_period: 45s
    volumes:
    - mysql-vol-1:/var/lib/mysql/
    - mysql-socket-vol-1:/var/run/mysqld/:z
    - /home/mailcow/data/conf/mysql/:/etc/mysql/conf.d/:ro,Z
    environment:
    - TZ=${TZ}
    - MYSQL_ROOT_PASSWORD=${DBROOT}
    - MYSQL_DATABASE=${DBNAME}
    - MYSQL_USER=${DBUSER}
    - MYSQL_PASSWORD=${DBPASS}
    - MYSQL_INITDB_SKIP_TZINFO=1
    restart: always
    ports:
    - ${SQL_PORT:-127.0.0.1:13306}:3306
    networks:
      mailcow-network:
        aliases:
        - mysql
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis-mailcow:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    entrypoint:
    - /bin/sh
    - /redis-conf.sh
    volumes:
    - redis-vol-1:/data/
    - /home/mailcow/data/conf/redis/redis-conf.sh:/redis-conf.sh:z
    restart: always
    depends_on:
    - netfilter-mailcow
    ports:
    - ${REDIS_PORT:-127.0.0.1:7654}:6379
    environment:
    - TZ=${TZ}
    - REDISPASS=${REDISPASS}
    - REDISMASTERPASS=${REDISMASTERPASS:-}
    sysctls:
    - net.core.somaxconn=4096
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.249
        aliases:
        - redis
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  clamd-mailcow:
    image: ghcr.io/mailcow/clamd:1.4.6-1@sha256:0d512b3a179c5f97e6f3132d1f88d9ec72c456fc6f7ba32a664ed4327fbd1436
    restart: always
    depends_on:
      unbound-mailcow:
        condition: service_healthy
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    environment:
    - TZ=${TZ}
    - SKIP_CLAMD=${SKIP_CLAMD:-n}
    volumes:
    - /home/mailcow/data/conf/clamav/:/etc/clamav/:Z
    - clamd-db-vol-1:/var/lib/clamav
    networks:
      mailcow-network:
        aliases:
        - clamd
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  rspamd-mailcow:
    image: ghcr.io/mailcow/rspamd:4.1.4-1@sha256:eebf09b0f0eb87b3bf968fabe39a095b111e85e801cade6074a97ca21b53d3a5
    stop_grace_period: 30s
    depends_on:
    - dovecot-mailcow
    - clamd-mailcow
    environment:
    - TZ=${TZ}
    - IPV4_NETWORK=${IPV4_NETWORK:-172.22.1}
    - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
    - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
    - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
    - REDISPASS=${REDISPASS}
    - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY:-}
    volumes:
    - /home/mailcow/data/hooks/rspamd:/hooks:Z
    - /home/mailcow/data/conf/rspamd/custom/:/etc/rspamd/custom:z
    - /home/mailcow/data/conf/rspamd/override.d/:/etc/rspamd/override.d:Z
    - /home/mailcow/data/conf/rspamd/local.d/:/etc/rspamd/local.d:Z
    - /home/mailcow/data/conf/rspamd/plugins.d/:/etc/rspamd/plugins.d:Z
    - /home/mailcow/data/conf/rspamd/lua/:/etc/rspamd/lua/:ro,Z
    - /home/mailcow/data/conf/rspamd/rspamd.conf.local:/etc/rspamd/rspamd.conf.local:Z
    - /home/mailcow/data/conf/rspamd/rspamd.conf.override:/etc/rspamd/rspamd.conf.override:Z
    - rspamd-vol-1:/var/lib/rspamd
    restart: always
    hostname: rspamd
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
        - rspamd
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  php-fpm-mailcow:
    image: ghcr.io/mailcow/phpfpm:8.2.29-3@sha256:0a8679cc8bab04262cfb399fc0b4608658d3db0c0c9a42087b0acd601dd66679
    command: php-fpm -d date.timezone=${TZ} -d expose_php=0
    depends_on:
    - redis-mailcow
    volumes:
    - /home/mailcow/data/hooks/phpfpm:/hooks:Z
    - /home/mailcow/data/web:/web:z
    - /home/mailcow/data/conf/rspamd/dynmaps:/dynmaps:ro,z
    - /home/mailcow/data/conf/rspamd/custom/:/rspamd_custom_maps:z
    - /home/mailcow/data/conf/dovecot/auth/mailcowauth.php:/mailcowauth/mailcowauth.php:z
    - /home/mailcow/data/web/inc/functions.inc.php:/mailcowauth/functions.inc.php:z
    - /home/mailcow/data/web/inc/functions.auth.inc.php:/mailcowauth/functions.auth.inc.php:z
    - /home/mailcow/data/web/inc/sessions.inc.php:/mailcowauth/sessions.inc.php:z
    - /home/mailcow/data/web/inc/functions.mailbox.inc.php:/mailcowauth/functions.mailbox.inc.php:z
    - /home/mailcow/data/web/inc/functions.ratelimit.inc.php:/mailcowauth/functions.ratelimit.inc.php:z
    - /home/mailcow/data/web/inc/functions.acl.inc.php:/mailcowauth/functions.acl.inc.php:z
    - rspamd-vol-1:/var/lib/rspamd
    - mysql-socket-vol-1:/var/run/mysqld/:z
    - /home/mailcow/data/conf/sogo/:/etc/sogo/:z
    - /home/mailcow/data/conf/rspamd/meta_exporter:/meta_exporter:ro,z
    - /home/mailcow/data/conf/phpfpm/crons:/crons:z
    - /home/mailcow/data/conf/phpfpm/sogo-sso/:/etc/sogo-sso/:z
    - /home/mailcow/data/conf/phpfpm/php-fpm.d/pools.conf:/usr/local/etc/php-fpm.d/z-pools.conf:Z
    - /home/mailcow/data/conf/phpfpm/php-conf.d/opcache-recommended.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:Z
    - /home/mailcow/data/conf/phpfpm/php-conf.d/upload.ini:/usr/local/etc/php/conf.d/upload.ini:Z
    - /home/mailcow/data/conf/phpfpm/php-conf.d/other.ini:/usr/local/etc/php/conf.d/zzz-other.ini:Z
    - /home/mailcow/data/conf/dovecot/global_sieve_before:/global_sieve/before:z
    - /home/mailcow/data/conf/dovecot/global_sieve_after:/global_sieve/after:z
    - /home/mailcow/data/assets/templates:/tpls:z
    - /home/mailcow/data/conf/nginx/:/etc/nginx/conf.d/:z
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    environment:
    - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
    - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
    - REDISPASS=${REDISPASS}
    - LOG_LINES=${LOG_LINES:-9999}
    - TZ=${TZ}
    - DBNAME=${DBNAME}
    - DBUSER=${DBUSER}
    - DBPASS=${DBPASS}
    - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
    - MAILCOW_PASS_SCHEME=${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
    - IMAP_PORT=${IMAP_PORT:-143}
    - IMAPS_PORT=${IMAPS_PORT:-993}
    - POP_PORT=${POP_PORT:-110}
    - POPS_PORT=${POPS_PORT:-995}
    - SIEVE_PORT=${SIEVE_PORT:-4190}
    - IPV4_NETWORK=${IPV4_NETWORK:-172.22.1}
    - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
    - SUBMISSION_PORT=${SUBMISSION_PORT:-587}
    - SMTPS_PORT=${SMTPS_PORT:-465}
    - SMTP_PORT=${SMTP_PORT:-25}
    - API_KEY=${API_KEY:-invalid}
    - API_KEY_READ_ONLY=${API_KEY_READ_ONLY:-invalid}
    - API_ALLOW_FROM=${API_ALLOW_FROM:-invalid}
    - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
    - SKIP_FTS=${SKIP_FTS:-y}
    - SKIP_CLAMD=${SKIP_CLAMD:-n}
    - SKIP_OLEFY=${SKIP_OLEFY:-n}
    - SKIP_SOGO=${SKIP_SOGO:-n}
    - ALLOW_ADMIN_EMAIL_LOGIN=${ALLOW_ADMIN_EMAIL_LOGIN:-n}
    - MASTER=${MASTER:-y}
    - DEV_MODE=${DEV_MODE:-n}
    - DEMO_MODE=${DEMO_MODE:-n}
    - WEBAUTHN_ONLY_TRUSTED_VENDORS=${WEBAUTHN_ONLY_TRUSTED_VENDORS:-n}
    - CLUSTERMODE=${CLUSTERMODE:-}
    - ADDITIONAL_SERVER_NAMES=${ADDITIONAL_SERVER_NAMES:-}
    restart: always
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.phpfpm_keycloak_sync.schedule: 0 * * * * *
      ofelia.job-exec.phpfpm_keycloak_sync.no-overlap: 'true'
      ofelia.job-exec.phpfpm_keycloak_sync.command: /bin/bash -c "php /crons/keycloak-sync.php
        || exit 0"
      ofelia.job-exec.phpfpm_ldap_sync.schedule: 0 * * * * *
      ofelia.job-exec.phpfpm_ldap_sync.no-overlap: 'true'
      ofelia.job-exec.phpfpm_ldap_sync.command: /bin/bash -c "php /crons/ldap-sync.php
        || exit 0"
    networks:
      mailcow-network:
        aliases:
        - phpfpm
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  dovecot-mailcow:
    image: ghcr.io/mailcow/dovecot:2.3.21.1-2@sha256:4b351795c1e08f52c6ea5de23054fb7ff94d144ff3263821178cc4f883b6f0e1
    depends_on:
    - mysql-mailcow
    - netfilter-mailcow
    - redis-mailcow
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    cap_add:
    - NET_BIND_SERVICE
    volumes:
    - /home/mailcow/data/hooks/dovecot:/hooks:Z
    - /home/mailcow/data/conf/dovecot:/etc/dovecot:z
    - /home/mailcow/data/assets/ssl:/etc/ssl/mail/:ro,z
    - /home/mailcow/data/conf/sogo/:/etc/sogo/:z
    - /home/mailcow/data/conf/phpfpm/sogo-sso/:/etc/phpfpm/:z
    - vmail-vol-1:/var/vmail
    - vmail-index-vol-1:/var/vmail_index
    - crypt-vol-1:/mail_crypt/
    - /home/mailcow/data/conf/rspamd/custom/:/etc/rspamd/custom:z
    - /home/mailcow/data/assets/templates:/templates:z
    - rspamd-vol-1:/var/lib/rspamd
    - mysql-socket-vol-1:/var/run/mysqld/:z
    environment:
    - DOVECOT_MASTER_USER=${DOVECOT_MASTER_USER:-}
    - DOVECOT_MASTER_PASS=${DOVECOT_MASTER_PASS:-}
    - MAILCOW_REPLICA_IP=${MAILCOW_REPLICA_IP:-}
    - DOVEADM_REPLICA_PORT=${DOVEADM_REPLICA_PORT:-}
    - LOG_LINES=${LOG_LINES:-9999}
    - DBNAME=${DBNAME}
    - DBUSER=${DBUSER}
    - DBPASS=${DBPASS}
    - TZ=${TZ}
    - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
    - MAILCOW_PASS_SCHEME=${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
    - IPV4_NETWORK=${IPV4_NETWORK:-172.22.1}
    - ALLOW_ADMIN_EMAIL_LOGIN=${ALLOW_ADMIN_EMAIL_LOGIN:-n}
    - MAILDIR_GC_TIME=${MAILDIR_GC_TIME:-7200}
    - ACL_ANYONE=${ACL_ANYONE:-disallow}
    - SKIP_FTS=${SKIP_FTS:-y}
    - FTS_HEAP=${FTS_HEAP:-512}
    - FTS_PROCS=${FTS_PROCS:-3}
    - MAILDIR_SUB=${MAILDIR_SUB:-}
    - MASTER=${MASTER:-y}
    - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
    - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
    - REDISPASS=${REDISPASS}
    - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
    ports:
    - ${DOVEADM_PORT:-127.0.0.1:19991}:12345
    - ${IMAP_PORT:-143}:143
    - ${IMAPS_PORT:-993}:993
    - ${POP_PORT:-110}:110
    - ${POPS_PORT:-995}:995
    - ${SIEVE_PORT:-4190}:4190
    restart: always
    tty: true
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.dovecot_imapsync_runner.schedule: 0 * * * * *
      ofelia.job-exec.dovecot_imapsync_runner.no-overlap: 'true'
      ofelia.job-exec.dovecot_imapsync_runner.command: /bin/bash -c "[[ $${MASTER}
        == y ]] && /usr/local/bin/gosu nobody /usr/local/bin/imapsync_runner.pl ||
        exit 0"
      ofelia.job-exec.dovecot_trim_logs.schedule: 0 * * * * *
      ofelia.job-exec.dovecot_trim_logs.command: /bin/bash -c "[[ $${MASTER} == y
        ]] && /usr/local/bin/gosu vmail /usr/local/bin/trim_logs.sh || exit 0"
      ofelia.job-exec.dovecot_quarantine.schedule: 0 */20 * * * *
      ofelia.job-exec.dovecot_quarantine.command: /bin/bash -c "[[ $${MASTER} == y
        ]] && /usr/local/bin/gosu vmail /usr/local/bin/quarantine_notify.py || exit
        0"
      ofelia.job-exec.dovecot_clean_q_aged.schedule: 0 0 0 * * *
      ofelia.job-exec.dovecot_clean_q_aged.command: /bin/bash -c "[[ $${MASTER} ==
        y ]] && /usr/local/bin/gosu vmail /usr/local/bin/clean_q_aged.sh || exit 0"
      ofelia.job-exec.dovecot_maildir_gc.schedule: 0 */30 * * * *
      ofelia.job-exec.dovecot_maildir_gc.command: /bin/bash -c "source /source_env.sh
        ; /usr/local/bin/gosu vmail /usr/local/bin/maildir_gc.sh"
      ofelia.job-exec.dovecot_sarules.schedule: '@every 24h'
      ofelia.job-exec.dovecot_sarules.command: /bin/bash -c "/usr/local/bin/sa-rules.sh"
      ofelia.job-exec.dovecot_fts.schedule: 0 0 0 * * *
      ofelia.job-exec.dovecot_fts.command: /bin/bash -c "/usr/local/bin/gosu vmail
        /usr/local/bin/optimize-fts.sh"
      ofelia.job-exec.dovecot_repl_health.schedule: 0 */5 * * * *
      ofelia.job-exec.dovecot_repl_health.command: /bin/bash -c "/usr/local/bin/gosu
        vmail /usr/local/bin/repl_health.sh"
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.250
        aliases:
        - dovecot
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postfix-mailcow:
    image: ghcr.io/mailcow/postfix:3.10.12-1@sha256:f3b704269c38583a2c5cba30fc57e76d1d108abed22b647b91f240e96d8a126c
