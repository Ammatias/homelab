        condition: service_healthy
    volumes:
    - postfix-tlspol-vol-1:/var/lib/postfix-tlspol
    environment:
    - LOG_LINES=${LOG_LINES:-9999}
    - TZ=${TZ}
    - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
    - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
    - REDISPASS=${REDISPASS}
    - DEV_MODE=${DEV_MODE:-n}
    restart: always
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
        - postfix-tlspol
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  memcached-mailcow:
    image: memcached:alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7
    restart: always
    environment:
    - TZ=${TZ}
    networks:
      mailcow-network:
        aliases:
        - memcached
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  nginx-mailcow:
    depends_on:
    - redis-mailcow
    - php-fpm-mailcow
