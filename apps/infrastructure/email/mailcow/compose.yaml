    - rspamd-vol-1:/var/lib/rspamd
    - mysql-socket-vol-1:/var/run/mysqld/:z
    environment:
    - LOG_LINES=${LOG_LINES:-9999}
    - TZ=${TZ}
    - DBNAME=${DBNAME}
    - DBUSER=${DBUSER}
    - DBPASS=${DBPASS}
    - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
    - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
    - REDISPASS=${REDISPASS}
    - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
    - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY:-}
    cap_add:
    - NET_BIND_SERVICE
    ports:
    - ${SMTP_PORT:-25}:25
    - ${SMTPS_PORT:-465}:465
    - ${SUBMISSION_PORT:-587}:587
    restart: always
    dns:
    - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.253
        aliases:
        - postfix
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      example.config-revision: mail-relay
  postfix-tlspol-mailcow:
    image: ghcr.io/mailcow/postfix-tlspol:1.8.23@sha256:44d2b3fb5a1fa8be7741e27cd468bcfaeff3c8820f89db1f5d4a6e9f6f872280
    depends_on:
