services:
  trilium-server:
    image: triliumnext/trilium:latest@sha256:8e6bc939a6d5dbeed42d1b5b155bc790b1c28ca3ac414382d04d626903c62081
    container_name: trilium-server
    restart: unless-stopped
    ports:
      - "${TRILIUM_PORT:-8081}:8080"
    environment:
      TRILIUM_NETWORK_TRUSTEDREVERSEPROXY: ${TRILIUM_TRUSTED_PROXY:-172.18.0.0/16}
      TRILIUM_DATA_DIR: /home/node/trilium-data
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${DATA_ROOT:-./data}:/home/node/trilium-data
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    external: true
