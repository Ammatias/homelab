services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest@sha256:5f26407fd2ede54df76d63304ef184576a6c1bb73f934a58a11abdd852fab549
    container_name: wg-easy
    restart: unless-stopped
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "${WG_UI_PORT:-51821}:51821/tcp"
    volumes:
      - ${DATA_ROOT:-./data}:/etc/wireguard
    environment:
      LANG: ${LANG:-en}
      INIT_USERNAME: ${INIT_USERNAME}
      INIT_PASSWORD: ${INIT_PASSWORD}
      WG_HOST: ${WG_HOST}
      WG_PORT: ${WG_PORT:-51820}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

networks:
  frontend:
    external: true
