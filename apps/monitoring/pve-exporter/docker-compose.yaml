services:
  pve-exporter:
    image: prompve/prometheus-pve-exporter
    container_name: pve-exporter
    restart: unless-stopped
    ports:
      - 9221:9221
    volumes:
      - /home/pve-exporter/pve.yml:/etc/prometheus/pve.yml
    security_opt:
      - no-new-privileges=true
    networks:
      - backend

networks:
  backend:
    external: true